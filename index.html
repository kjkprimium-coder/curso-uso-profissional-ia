<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Protótipo navegável — Uso Profissional de IA">
  <title>Uso Profissional de IA — V0.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button>
      <a class="brand" href="#/" aria-label="Início">
        <span class="brand-mark">K</span>
        <span>
          <strong>Uso Profissional de IA</strong>
          <small>Protótipo V0.1</small>
        </span>
      </a>
      <div class="topbar-actions">
        <div class="progress-mini"><span id="topProgressBar"></span></div>
        <span id="topProgressText">0%</span>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span class="eyebrow">CURSO 01</span>
          <h2>Trilha profissional</h2>
        </div>
        <nav id="courseNav" aria-label="Navegação do curso"></nav>
        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span>Seu progresso fica salvo neste dispositivo.</span>
        </div>
      </aside>

      <main id="app" class="main" tabindex="-1"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
